<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karunada">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Karunada Collection – Trendy, Stylish & Affordable men's fashion. Shop new arrivals, exclusive offers and more.">

  <title>Karunada Collection</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/app.css">

  <!-- Preconnect for fonts (loaded in CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

<div id="app">

  <!-- ══════════════════ HEADER ══════════════════ -->
  <header class="app-header">
    <!-- Back button (hidden on root tabs) -->
    <button class="hdr-btn" id="hdr-back" style="display:none" aria-label="Back">
      &#8592;
    </button>

    <!-- Logo (shown on Home) / Title (shown on other screens) -->
    <div id="hdr-title" style="flex:1;font-size:1rem;font-weight:700;color:var(--text-1);text-align:center;letter-spacing:-0.01em">
      <!-- filled by router -->
    </div>

    <!-- Search button -->
    <button class="hdr-btn" id="hdr-search" aria-label="Search">🔍</button>

    <!-- Cart button -->
    <div class="cart-badge-wrap">
      <button class="hdr-btn" id="hdr-cart" aria-label="Cart">🛒
        <span class="cart-badge-dot" id="hdr-cart-badge"></span>
      </button>
    </div>
  </header>

  <!-- Offline banner -->
  <div id="offline-banner">📡 You're offline — some features may be unavailable</div>

  <!-- ══════════════════ SCREEN CONTENT ══════════════════ -->
  <div id="screen-wrap">
    <!-- Screens are rendered here by the router -->
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>

  <!-- ══════════════════ BOTTOM NAV ══════════════════ -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <button class="nav-item active" data-screen="home" aria-label="Home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item" data-screen="shop" aria-label="Shop">
      <span class="nav-icon">🛍️</span>
      <span class="nav-label">Shop</span>
    </button>
    <button class="nav-item" data-screen="cart" aria-label="Cart">
      <div class="nav-cart-wrap">
        <span class="nav-icon">🛒</span>
        <span class="nav-cart-badge" id="nav-cart-badge"></span>
      </div>
      <span class="nav-label">Cart</span>
    </button>
    <button class="nav-item" data-screen="favourites" aria-label="Favourites">
      <span class="nav-icon">❤️</span>
      <span class="nav-label">Saved</span>
    </button>
    <button class="nav-item" data-screen="account" aria-label="Account">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Account</span>
    </button>
  </nav>

</div>

<!-- ══════════════════ TOAST ══════════════════ -->
<div id="toast" role="alert" aria-live="polite"></div>

<!-- ══════════════════ SCRIPTS ══════════════════ -->
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/router.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>

</body>
</html>
