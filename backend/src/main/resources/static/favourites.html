<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Favourites – Karunada Collection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .fav-heart { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; }
    .fav-heart:hover { transform: scale(1.2); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Karunada Collection</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item active"><a class="nav-link" href="favourites.html">❤️ Favourites <span id="favCount" class="badge badge-danger ml-1"></span></a></li>
      </ul>
      <ul class="navbar-nav ml-2">
        <li class="nav-item">
          <a class="nav-link cart-icon-link" href="cart.html">🛒 <span id="cartCount" class="badge ml-1"></span></a>
        </li>
        <li id="authNav"></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <h2>❤️ My Favourites</h2>
    <p class="text-muted">Products you've saved for later</p>

    <div class="row" id="favList">
      <div class="col-12 text-center py-5">
        <span style="font-size:3rem;">❤️</span>
        <h4 class="mt-3 text-muted">Your favourites list is empty</h4>
        <a href="shop.html" class="btn btn-primary mt-2">Browse Products</a>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026 Karunada Collection | <a href="index.html" class="text-light">Home</a> | <a href="shop.html" class="text-light">Shop</a></p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favourites.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const favs = getFavourites();
      const container = document.getElementById('favList');
      if (!favs || favs.length === 0) return;

      container.innerHTML = favs.map(p => `
        <div class="col-md-3 mb-4" id="fav-card-${p.id}">
          <div class="card h-100">
            <div style="position:relative;">
              <img src="${p.image || 'images/shirt.jpg'}" class="card-img-top"
                   style="height:200px;object-fit:cover;"
                   onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"
                   alt="${p.name}">
              <button onclick="removeFav(${p.id})"
                      style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.9);border:none;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;"
                      title="Remove from favourites">❤️</button>
            </div>
            <div class="card-body d-flex flex-column">
              <h6 class="card-title">${p.name}</h6>
              <p class="text-primary font-weight-bold">₹${p.price}</p>
              <div class="mt-auto d-flex">
                <a href="product.html?id=${p.id}" class="btn btn-primary btn-sm flex-grow-1 mr-1">View</a>
                <button class="btn btn-success btn-sm flex-grow-1"
                        onclick='addToCart(${JSON.stringify({id:p.id,name:p.name,price:p.price,image:p.image||"images/shirt.jpg"})});alert("Added to cart!")'>
                  🛒 Cart
                </button>
              </div>
            </div>
          </div>
        </div>`).join('');
    });

    function removeFav(id) {
      const favs = getFavourites().filter(f => f.id != id);
      localStorage.setItem('karunadaFavourites', JSON.stringify(favs));
      const card = document.getElementById('fav-card-' + id);
      if (card) card.remove();
      refreshFavBadge();
      if (getFavourites().length === 0) {
        document.getElementById('favList').innerHTML = `
          <div class="col-12 text-center py-5">
            <span style="font-size:3rem;">❤️</span>
            <h4 class="mt-3 text-muted">Your favourites list is empty</h4>
            <a href="shop.html" class="btn btn-primary mt-2">Browse Products</a>
          </div>`;
      }
    }
  </script>
</body>
</html>
