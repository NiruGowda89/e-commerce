<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Confirmation - Urban Man</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Karunada Collection</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item active"><a class="nav-link" href="delivery.html">🚚 Delivery</a></li>
      </ul>
      <ul class="navbar-nav ml-2">
        <li class="nav-item">
          <a class="nav-link" href="cart.html">🛒 <span id="cartCount" class="badge badge-light ml-1"></span></a>
        </li>
        <li id="authNav"></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5 mb-5" style="max-width:500px;">

    <!-- Header -->
    <div class="text-center mb-4">
      <span style="font-size:3rem;">🚚</span>
      <h3 class="mt-2">Delivery Confirmation</h3>
      <p class="text-muted">Enter the Order ID and customer OTP to confirm delivery</p>
    </div>

    <!-- OTP Form -->
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div id="formSection">
          <div class="form-group">
            <label for="deliveryOrderId"><strong>Order ID</strong></label>
            <input type="text" class="form-control form-control-lg" id="deliveryOrderId"
                   placeholder="e.g. ORD-1234567890" autocomplete="off">
          </div>
          <div class="form-group mt-3">
            <label for="deliveryOtp"><strong>Customer OTP</strong></label>
            <input type="text" class="form-control form-control-lg text-center"
                   id="deliveryOtp" maxlength="6" placeholder="_ _ _ _ _ _"
                   style="font-size:1.8rem;letter-spacing:8px;font-weight:700;"
                   autocomplete="off">
            <small class="text-muted">Ask the customer for their 6-digit OTP</small>
          </div>
          <button class="btn btn-success btn-block btn-lg mt-4" onclick="confirmDelivery()">
            ✅ Confirm Delivery
          </button>
        </div>

        <!-- Success section (hidden initially) -->
        <div id="successSection" style="display:none;" class="text-center py-3">
          <span style="font-size:4rem;">🎉</span>
          <h4 class="mt-3 text-success">Delivery Confirmed!</h4>
          <p class="text-muted" id="successMsg"></p>
          <hr>
          <button class="btn btn-primary" onclick="resetForm()">Confirm Another Delivery</button>
        </div>

        <!-- Error message -->
        <div id="errorMsg" class="alert alert-danger mt-3" style="display:none;"></div>
      </div>
    </div>

    <!-- Recent deliveries today -->
    <div class="card mt-4 shadow-sm">
      <div class="card-header bg-dark text-white">
        <strong>📋 Today's Deliveries</strong>
      </div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <thead class="thead-light">
            <tr><th>Order ID</th><th>Customer</th><th>Status</th></tr>
          </thead>
          <tbody id="todayDeliveries"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026 Urban Man — Delivery Portal</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/delivery.js"></script>
</body>
</html>
