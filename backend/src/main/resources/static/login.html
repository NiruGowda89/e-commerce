<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0c29">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Login – Karunada Collection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 55%, #1a1a2e 100%);
      overflow-x: hidden;
    }

    /* ── Shell ── */
    .login-shell {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .login-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top), 14px) 20px 14px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .login-header-brand {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffc107;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .login-header-brand:hover { color: #ffc107; text-decoration: none; }
    .header-links { display: flex; gap: 10px; }
    .header-links a {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .header-links a:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* ── Scroll area ── */
    .login-scroll {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px max(env(safe-area-inset-bottom), 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Card ── */
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* ── Card top accent bar ── */
    .auth-card__bar {
      height: 5px;
      background: linear-gradient(90deg, #ffc107, #ff9800, #ffc107);
      background-size: 200% 100%;
      animation: shimmer 2s infinite linear;
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* ── Card body ── */
    .auth-card__body { padding: 36px 32px 28px; }

    /* Logo + title */
    .auth-logo {
      width: 60px; height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, #302b63, #0f3460);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 18px;
      box-shadow: 0 6px 20px rgba(48,43,99,0.35);
    }
    .auth-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .auth-sub {
      text-align: center;
      font-size: 0.83rem;
      color: #6b7280;
      margin-bottom: 28px;
    }

    /* ── Error / success msg ── */
    .auth-msg {
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .auth-msg--error   { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }
    .auth-msg--success { background: #f0fdf4; border: 1px solid #86efac; color: #16a34a; }

    /* ── Fields ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: #374151;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 11px;
      font-size: 0.95rem;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input::placeholder { color: #9ca3af; }
    .field input:focus {
      border-color: #302b63;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(48,43,99,0.1);
    }

    /* ── Password wrapper with show/hide ── */
    .field-pw { position: relative; }
    .field-pw input { padding-right: 46px; }
    .pw-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 1rem; color: #9ca3af;
      padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .pw-toggle:hover { color: #374151; }

    /* ── Primary button ── */
    .btn-primary-auth {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #302b63, #0f3460);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.2px;
      margin-top: 8px;
      box-shadow: 0 4px 18px rgba(48,43,99,0.35);
      transition: transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary-auth:hover  { box-shadow: 0 6px 24px rgba(48,43,99,0.45); transform: translateY(-1px); }
    .btn-primary-auth:active { transform: scale(0.98); }
    .btn-primary-auth:disabled { opacity: 0.65; transform: none; cursor: not-allowed; }

    /* ── Forgot link ── */
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.78rem;
      color: #302b63;
      font-weight: 600;
      text-decoration: none;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .forgot-link:hover { text-decoration: underline; color: #302b63; }

    /* ── Divider ── */
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      color: #d1d5db; font-size: 0.78rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: ''; flex: 1;
      height: 1px; background: #e5e7eb;
    }

    /* ── Register toggle ── */
    .auth-toggle {
      text-align: center;
      font-size: 0.84rem;
      color: #6b7280;
      margin-top: 16px;
    }
    .auth-toggle a {
      color: #302b63;
      font-weight: 700;
      text-decoration: none;
    }
    .auth-toggle a:hover { text-decoration: underline; }

    /* Register fields — hidden by default */
    .register-fields { display: none; }

    /* ── Support footer ── */
    .auth-card__footer {
      text-align: center;
      padding: 14px 20px 18px;
      background: #f9fafb;
      border-top: 1px solid #f0f0f0;
    }
    .auth-card__footer a {
      font-size: 0.8rem;
      color: #6b7280;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .auth-card__footer a:hover { color: #302b63; }

    /* ── Footer text ── */
    .login-footer {
      text-align: center;
      padding: 14px 16px max(env(safe-area-inset-bottom), 14px);
      color: rgba(255,255,255,0.25);
      font-size: 0.74rem;
    }

    /* ── Forgot password screen ── */
    #forgotScreen { display: none; }

    @media (max-width: 440px) {
      .auth-card__body { padding: 28px 20px 20px; }
      .auth-title { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
<div class="login-shell">

  <!-- Header -->
  <header class="login-header">
    <a class="login-header-brand" href="index.html">🛍️ Karunada Collection</a>
    <div class="header-links">
      <a href="shop.html">Shop</a>
      <a href="cart.html">🛒 Cart</a>
    </div>
  </header>

  <!-- Scroll area -->
  <div class="login-scroll">
    <div class="auth-card">
      <div class="auth-card__bar"></div>
      <div class="auth-card__body">

        <!-- ── LOGO + TITLE ── -->
        <div class="auth-logo" id="authLogo">🛍️</div>
        <div class="auth-title" id="authTitle">Welcome back</div>
        <div class="auth-sub"   id="authSub">Sign in to your account</div>

        <!-- ── MESSAGE BOX ── -->
        <div class="auth-msg auth-msg--error"   id="authErr"></div>
        <div class="auth-msg auth-msg--success" id="authOk"></div>

        <!-- ── MAIN FORM ── -->
        <form id="mainForm" autocomplete="on">

          <!-- Register-only fields -->
          <div class="register-fields" id="registerFields">
            <div class="field">
              <label>Full Name</label>
              <input type="text" id="regName" placeholder="Your full name"
                     autocomplete="name" autocapitalize="words">
            </div>
            <div class="field">
              <label>Phone Number</label>
              <input type="tel" id="regPhone" placeholder="10-digit mobile"
                     inputmode="tel" autocomplete="tel">
            </div>
          </div>

          <!-- Email -->
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="authEmail" placeholder="you@example.com"
                   autocomplete="email" inputmode="email" required>
          </div>

          <!-- Password -->
          <div class="field">
            <label>Password</label>
            <div class="field-pw">
              <input type="password" id="authPassword" placeholder="Enter your password"
                     autocomplete="current-password" required>
              <button type="button" class="pw-toggle" id="pwToggle"
                      onclick="togglePw()" tabindex="-1">👁</button>
            </div>
          </div>

          <!-- Confirm password (register only) -->
          <div class="register-fields" id="confirmFields">
            <div class="field">
              <label>Confirm Password</label>
              <div class="field-pw">
                <input type="password" id="authConfirm" placeholder="Repeat password"
                       autocomplete="new-password">
              </div>
            </div>
          </div>

          <!-- Forgot link (login mode only) -->
          <a href="#" class="forgot-link" id="forgotLink"
             onclick="showForgot(); return false;"style="color: #007bff; text-decoration: underline; text-align: center;">Forgot password?</a>

          <!-- Submit -->
          <button type="submit" class="btn-primary-auth" id="submitBtn">
            Sign In →
          </button>
        </form>

        <!-- Toggle login ↔ register -->
        <div class="auth-toggle" id="authToggle">
          New here?
          <a href="#" onclick="setMode('register'); return false;">Create an account</a>
        </div>

        <!-- ── FORGOT PASSWORD ── -->
        <div id="forgotScreen">
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="forgotEmail" placeholder="you@example.com" inputmode="email">
          </div>
          <button type="button" class="btn-primary-auth" onclick="submitForgot()">
            Send Reset Link →
          </button>
          <div class="auth-toggle" style="margin-top:14px;">
            <a href="#" onclick="setMode('login'); return false;">← Back to Sign In</a>
          </div>
        </div>

      </div><!-- /body -->

      <!-- Support footer -->
      <div class="auth-card__footer">
        <a href="tel:9876543210">📞 Need help? 9876543210</a>
      </div>
    </div><!-- /auth-card -->
  </div><!-- /login-scroll -->

  <div class="login-footer">&copy; 2026 Karunada Collection. All rights reserved.</div>

</div><!-- /login-shell -->

<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  /* ── Current mode: 'login' | 'register' ── */
  var _mode = 'login';

  /* ── Redirect if already logged in ── */
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof getCurrentUser === 'function' && getCurrentUser()) {
      var u = getCurrentUser();
      if (u.role === 'SUPER_ADMIN')      window.location.href = 'super-admin.html';
      else if (u.role === 'ADMIN')       window.location.href = 'admin.html';
      else window.location.href = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
    }
  });

  /* ── Toggle password visibility ── */
  function togglePw() {
    var inp = document.getElementById('authPassword');
    var btn = document.getElementById('pwToggle');
    if (inp.type === 'password') { inp.type = 'text';     btn.textContent = '🙈'; }
    else                         { inp.type = 'password'; btn.textContent = '👁';  }
  }

  /* ── Switch between login and register ── */
  function setMode(mode) {
    _mode = mode;
    var isReg = (mode === 'register');

    /* Show/hide register-only fields */
    document.querySelectorAll('.register-fields').forEach(function (el) {
      el.style.display = isReg ? 'block' : 'none';
    });

    /* Forgot link only visible in login mode */
    document.getElementById('forgotLink').style.display = isReg ? 'none' : 'block';

    /* Autocomplete hint */
    document.getElementById('authPassword').autocomplete = isReg ? 'new-password' : 'current-password';

    /* Labels / button */
    document.getElementById('authTitle').textContent  = isReg ? 'Create Account' : 'Welcome back';
    document.getElementById('authSub').textContent    = isReg ? 'Join Karunada Collection today' : 'Sign in to your account';
    document.getElementById('submitBtn').textContent  = isReg ? 'Create Account →' : 'Sign In →';
    document.getElementById('authLogo').textContent   = isReg ? '🎉' : '🛍️';
    document.getElementById('authToggle').innerHTML   = isReg
      ? 'Already have an account? <a href="#" onclick="setMode(\'login\');return false;">Sign in</a>'
      : 'New here? <a href="#" onclick="setMode(\'register\');return false;">Create an account</a>';

    /* Hide forgot screen, show main form */
    document.getElementById('forgotScreen').style.display = 'none';
    document.getElementById('mainForm').style.display     = 'block';
    document.getElementById('authToggle').style.display   = 'block';
    document.getElementById('forgotLink').style.display   = isReg ? 'none' : 'block';

    clearMsgs();
  }

  function showForgot() {
    document.getElementById('mainForm').style.display     = 'none';
    document.getElementById('authToggle').style.display   = 'none';
    document.getElementById('forgotScreen').style.display = 'block';
    document.getElementById('authTitle').textContent      = 'Reset Password';
    document.getElementById('authSub').textContent        = 'Enter your registered email';
    document.getElementById('authLogo').textContent       = '🔑';
    clearMsgs();
  }

  /* ── Message helpers ── */
  function showErr(msg) {
    var e = document.getElementById('authErr');
    e.textContent = msg; e.style.display = 'block';
    document.getElementById('authOk').style.display = 'none';
  }
  function showOk(msg) {
    var e = document.getElementById('authOk');
    e.textContent = msg; e.style.display = 'block';
    document.getElementById('authErr').style.display = 'none';
  }
  function clearMsgs() {
    document.getElementById('authErr').style.display = 'none';
    document.getElementById('authOk').style.display  = 'none';
  }

  /* ── MAIN FORM SUBMIT ── */
  document.getElementById('mainForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMsgs();

    var email = document.getElementById('authEmail').value.trim();
    var pass  = document.getElementById('authPassword').value;
    var btn   = document.getElementById('submitBtn');

    if (!email || !pass) { showErr('Please enter your email and password.'); return; }

    if (_mode === 'register') {
      /* ── REGISTER flow ── */
      var name  = document.getElementById('regName').value.trim();
      var phone = document.getElementById('regPhone').value.trim();
      var conf  = document.getElementById('authConfirm').value;

      if (!name)              { showErr('Please enter your full name.'); return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { showErr('Enter a valid email address.'); return; }
      if (phone.length < 10) { showErr('Enter a valid 10-digit phone number.'); return; }
      if (pass.length < 6)   { showErr('Password must be at least 6 characters.'); return; }
      if (pass !== conf)     { showErr('Passwords do not match.'); return; }

      btn.textContent = 'Creating account…'; btn.disabled = true;
      var result = await registerUser(name, email, phone, pass);
      btn.textContent = 'Create Account →'; btn.disabled = false;

      if (!result.ok) { showErr(result.msg); return; }
      showOk('✅ Account created! Redirecting…');
      setTimeout(function () {
        window.location.href =
          new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      }, 1000);

    } else {
      /* ── LOGIN flow — auto-detects admin vs user ── */
      btn.textContent = 'Signing in…'; btn.disabled = true;
      var result = await loginUser(email, pass);
      btn.textContent = 'Sign In →'; btn.disabled = false;

      if (!result.ok) { showErr(result.msg || 'Invalid email or password.'); return; }

      /* Route by role */
      if (result.user.role === 'SUPER_ADMIN') {
        window.location.href = 'super-admin.html';
      } else if (result.user.role === 'ADMIN') {
        window.location.href = 'admin.html';
      } else {
        window.location.href =
          new URLSearchParams(window.location.search).get('redirect') || 'index.html';
      }
    }
  });

  /* ── FORGOT PASSWORD ── */
  function submitForgot() {
    clearMsgs();
    var email = document.getElementById('forgotEmail').value.trim();
    if (!email) { showErr('Please enter your email address.'); return; }

    fetch((typeof API_URL !== 'undefined' ? API_URL : 'https://e-commerce-1-ariz.onrender.com/api')
          + '/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function (r) {
      if (r.ok) showOk('✅ Reset link sent to ' + email + '. Check your inbox.');
      else      showErr('❌ No account found with this email.');
    }).catch(function () {
      showErr('❌ Could not reach server. Please try again.');
    });
  }
</script>
</body>
</html>
