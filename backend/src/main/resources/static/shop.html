<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Karunada collection - Shop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html"> Karunada collection</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item active"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="new-arrivals.html">New Arrivals</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">Offers</a></li>
      </ul>
      <form class="form-inline mx-2" onsubmit="doSearch(event)">
        <div class="input-group">
          <input class="form-control form-control-sm" type="search" id="globalSearch"
                 placeholder="Search products…" style="width:180px;">
          <div class="input-group-append">
            <button class="btn btn-outline-light btn-sm" type="submit">🔍</button>
          </div>
        </div>
      </form>
      <ul class="navbar-nav ml-2">
        <li class="nav-item">
          <a class="nav-link" href="cart.html">
            🛒 <span id="cartCount" class="badge badge-light ml-1"></span>
          </a>
        </li>
        <li id="authNav" class="nav-item">
          <a class="nav-link font-weight-bold" href="login.html" style="color:#ffc107;border:1px solid #ffc107;border-radius:6px;padding:5px 12px;margin-left:4px;">👤 Login</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <h2>Shop Men's Fashion</h2>

    <!-- Filters -->
    <div class="row mb-3">
      <div class="col-md-3">
        <select class="form-control" id="sizeFilter">
          <option value="">All Sizes</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-control" id="colorFilter">
          <option value="">All Colors</option>
          <option value="Black">Black</option>
          <option value="Blue">Blue</option>
          <option value="White">White</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-secondary" id="clearFilters">Clear Filters</button>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="row" id="productList">
      <!-- Loaded by shop.js -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026  Karunada collection | <a href="index.html" class="text-light">Home</a> | <a href="cart.html" class="text-light">Cart</a> | <a href="admin.html" class="text-light">Admin</a></p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
