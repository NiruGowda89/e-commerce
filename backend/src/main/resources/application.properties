# Server Configuration
server.port=${PORT:8080}

# Database — set SPRING_DATASOURCE_URL on Render with full jdbc:postgresql:// URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gowda}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gowda123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Email (set these on Render for order confirmation)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay (set on Render)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Logging
logging.level.org.springframework=INFO
logging.level.com.urbanman=DEBUG
