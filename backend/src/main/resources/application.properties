# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Render provides DATABASE_URL as: postgresql://user:pass@host/db
# Spring Boot needs: jdbc:postgresql://user:pass@host/db
# We add the jdbc: prefix via JDBC_DATABASE_URL env var set on Render
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ecommerce_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${MYSQLUSER:gowda}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${MYSQLPASSWORD:gowda123}}

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.springframework=INFO
logging.level.com.urbanman=DEBUG
