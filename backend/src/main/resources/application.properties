# Server Configuration
server.port=${PORT:8080}

# Database — Render sets DATABASE_URL as postgresql://... we convert to jdbc:postgresql://...
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ecommerce_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:gowda}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:gowda123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework=INFO
logging.level.com.urbanman=DEBUG
