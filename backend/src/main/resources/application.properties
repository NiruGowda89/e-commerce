# Server Configuration
server.port=${PORT:8080}

# Database — Spring Boot reads these directly
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gowda}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gowda123}

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.springframework=INFO
logging.level.com.urbanman=DEBUG
