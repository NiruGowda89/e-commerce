<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product -  Karunada collection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html"> Karunada collection</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="new-arrivals.html">New Arrivals</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">Offers</a></li>
      </ul>
      <form class="form-inline mx-2" onsubmit="doSearch(event)">
        <div class="input-group">
          <input class="form-control form-control-sm" type="search" id="globalSearch"
                 placeholder="Search products…" style="width:180px;">
          <div class="input-group-append">
            <button class="btn btn-outline-light btn-sm" type="submit">🔍</button>
          </div>
        </div>
      </form>
      <ul class="navbar-nav ml-2">
        <li class="nav-item">
          <a class="nav-link" href="cart.html">
            🛒 <span id="cartCount" class="badge badge-light ml-1"></span>
          </a>
        </li>
        <li id="authNav"></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item"><a href="shop.html">Shop</a></li>
        <li class="breadcrumb-item active" id="breadcrumbProduct">Product</li>
      </ol>
    </nav>

    <div class="row">
      <!-- Product Image -->
      <div class="col-md-6">
        <img id="productImage" src="images/shirt.jpg" class="img-fluid rounded" alt="Product">
      </div>

      <!-- Product Details -->
      <div class="col-md-6">
        <h2 id="productName">Loading…</h2>
        <p id="productDesc" class="text-muted"></p>
        <p><span class="badge badge-secondary" id="productCategory"></span></p>
        <!-- Rating summary -->
        <div id="ratingBadge" class="mb-2"></div>
        <h4 class="text-primary">₹<span id="productPrice">0</span></h4>

        <div class="form-group">
          <label>Size</label>
          <select class="form-control w-50" id="sizeSelect">
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
          </select>
        </div>

        <div class="form-group">
          <label>Color</label>
          <select class="form-control w-50" id="colorSelect">
            <option value="Black">Black</option>
            <option value="Blue">Blue</option>
            <option value="White">White</option>
            <option value="Red">Red</option>
          </select>
        </div>

        <button class="btn btn-primary mt-2" id="addToCartBtn">Add to Cart</button>
        <button class="btn btn-success mt-2 ml-2" id="buyNowBtn">Buy Now</button>
        <a href="shop.html" class="btn btn-secondary mt-2 ml-2">← Back to Shop</a>
      </div>
    </div>

    <!-- Reviews Section -->
    <div class="row mt-5">
      <div class="col-12">
        <h4 class="mb-3">⭐ Customer Reviews</h4>
        <div id="reviewsList" class="mb-4"></div>

        <!-- Write a Review -->
        <div class="card" id="reviewFormCard">
          <div class="card-header"><strong>Write a Review</strong></div>
          <div class="card-body">
            <div class="form-group">
              <label>Rating</label>
              <select class="form-control w-25" id="reviewRating">
                <option value="5">⭐⭐⭐⭐⭐ 5 - Excellent</option>
                <option value="4">⭐⭐⭐⭐ 4 - Good</option>
                <option value="3">⭐⭐⭐ 3 - Average</option>
                <option value="2">⭐⭐ 2 - Poor</option>
                <option value="1">⭐ 1 - Terrible</option>
              </select>
            </div>
            <div class="form-group">
              <label>Comment</label>
              <textarea class="form-control" id="reviewComment" rows="3" placeholder="Share your experience…"></textarea>
            </div>
            <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
            <div id="reviewMsg" class="mt-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026  Karunada collection | <a href="index.html" class="text-light">Home</a> | <a href="shop.html" class="text-light">Shop</a> | <a href="cart.html" class="text-light">Cart</a></p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
