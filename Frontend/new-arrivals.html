<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Arrivals - Karunada Collection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .new-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #28a745;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .card { position: relative; }
    .hero-arrivals {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      padding: 3rem 2rem;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html">Karunada Collection</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item active"><a class="nav-link" href="new-arrivals.html">New Arrivals</a></li>
        <li class="nav-item"><a class="nav-link" href="offers.html">Offers</a></li>
      </ul>
      <form class="form-inline mx-2" onsubmit="doSearch(event)">
        <div class="input-group">
          <input class="form-control form-control-sm" type="search" id="globalSearch"
                 placeholder="Search products…" style="width:180px;">
          <div class="input-group-append">
            <button class="btn btn-outline-light btn-sm" type="submit">🔍</button>
          </div>
        </div>
      </form>
      <ul class="navbar-nav ml-2">
        <li class="nav-item">
          <a class="nav-link" href="cart.html">🛒 <span id="cartCount" class="badge badge-light ml-1"></span></a>
        </li>
        <li id="authNav" class="nav-item">
          <a class="nav-link font-weight-bold" href="login.html" style="color:#ffc107;border:1px solid #ffc107;border-radius:6px;padding:5px 12px;margin-left:4px;">👤 Login</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Hero Banner -->
  <div class="hero-arrivals text-center mb-4">
    <h1>✨ New Arrivals</h1>
    <p class="lead mb-0">Fresh styles just landed — be the first to grab them!</p>
  </div>

  <div class="container mb-5">

    <!-- Count badge -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Latest Collection</h5>
      <span class="badge badge-success px-3 py-2" id="arrivalCount">Loading…</span>
    </div>

    <!-- Product Grid -->
    <div class="row" id="newArrivalsList">
      <div class="col-12 text-center py-4">
        <div class="spinner-border text-success" role="status"></div>
        <p class="mt-2 text-muted">Loading new arrivals…</p>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026 Karunada Collection |
      <a href="index.html" class="text-light">Home</a> |
      <a href="shop.html" class="text-light">Shop</a> |
      <a href="offers.html" class="text-light">Offers</a>
    </p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
  <script src="js/new-arrivals.js"></script>
</body>
</html>
