<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Orders -  Karunada collection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="index.html"> Karunada collection</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
      </ul>
      <form class="form-inline mx-2" onsubmit="doSearch(event)">
        <div class="input-group">
          <input class="form-control form-control-sm" type="search" id="globalSearch"
                 placeholder="Search products…" style="width:180px;">
          <div class="input-group-append">
            <button class="btn btn-outline-light btn-sm" type="submit">🔍</button>
          </div>
        </div>
      </form>
      <ul class="navbar-nav ml-2">
        <li class="nav-item">
          <a class="nav-link" href="cart.html">
            🛒 <span id="cartCount" class="badge badge-light ml-1"></span>
          </a>
        </li>
        <li id="authNav"></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <h2>My Orders</h2>
    <p class="text-muted">Your order history. Share your <strong>Delivery OTP</strong> with the delivery person when they arrive.</p>

    <!-- Order ID Search -->
    <div class="input-group mb-4" style="max-width:420px;">
      <input type="text" class="form-control" id="orderSearchInput"
             placeholder="Search by Order ID (e.g. ORD-123456)">
      <div class="input-group-append">
        <button class="btn btn-primary" onclick="searchOrder()">🔍 Search</button>
        <button class="btn btn-secondary" onclick="clearOrderSearch()">✕</button>
      </div>
    </div>

    <!-- Orders list -->
    <div id="ordersList"></div>

    <!-- No orders message -->
    <div id="noOrders" class="text-center py-5" style="display:none;">
      <h4 class="text-muted">No orders yet</h4>
      <p class="text-muted">You haven't placed any orders yet.</p>
      <a href="shop.html" class="btn btn-primary">Start Shopping</a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">&copy; 2026  Karunada collection |
      <a href="index.html" class="text-light">Home</a> |
      <a href="shop.html" class="text-light">Shop</a> |
      <a href="cart.html" class="text-light">Cart</a>
    </p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
