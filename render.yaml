services:
  - type: web
    name: karunada-ecommerce
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      # ── Server ────────────────────────────────────────────────
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production

      # ── MySQL (Aiven cloud DB) ────────────────────────────────
      - key: DB_HOST
        value: mysql-19ceb2c-karunaducollections.h.aivencloud.com
      - key: DB_PORT
        value: 19804
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASS
        sync: false          # set in Render dashboard (secret)

      # ── JWT ──────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false          # set in Render dashboard (secret)
      - key: JWT_EXPIRATION
        value: 86400000

      # ── UPI Payment ──────────────────────────────────────────
      - key: MERCHANT_UPI
        value: 9380008927@ibl
      - key: MERCHANT_NAME
        value: Karunada Collection
